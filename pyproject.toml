[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eagle"
version = "0.1.0"
description = "EAGLE: Egocentric Automated Gaze-driven Lifting of Entities for 3D Segmentation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Gianluca Malvisi", email = "g.malvisi04@gmail.com" },
    { name = "Simone Melzi" },
    { name = "Alessandro Riva" },
]
license = { text = "MIT" }
keywords = ["eagle", "projectaria", "egocentric", "segmentation", "nerf", "eye-tracking", "3d-reconstruction", "gaze"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "projectaria-tools",
    "numpy",
    "torch",
    "opencv-python",
    "pandas",
    "Pillow",
    "plyfile",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
nerfstudio = ["nerfstudio"]
sam2 = ["segment-anything-2"]

[project.urls]
"Homepage" = "https://github.com/GianMalvisi/EAGLE"
"Paper" = "https://diglib.eg.org/handle/10.2312/stag20261xxx"
"Bug Tracker" = "https://github.com/GianMalvisi/EAGLE/issues"

[tool.hatch.build.targets.wheel]
packages = ["eagle"]
